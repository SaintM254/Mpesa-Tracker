name: Build & release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"
      release_name:
        description: "Release display name"
        required: true
        default: "M-PESA Tracker v1.1.0"
      upload_release:
        description: "Publish a GitHub release for this build?"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    name: Assemble signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS:   ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASS:        ${{ secrets.KEY_PASS }}
        run: |
          set -e
          mkdir -p android/app/signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using signing keystore from KEYSTORE_BASE64 secret."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/signing/release.jks
            echo "storeFile=signing/release.jks"          >  android/keystore.properties
            echo "storePassword=$KEYSTORE_PASS"           >> android/keystore.properties
            echo "keyAlias=$KEY_ALIAS"                    >> android/keystore.properties
            echo "keyPassword=$KEY_PASS"                  >> android/keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret — generating an ephemeral keystore for this build."
            KEY_PASS="mpesa-ephemeral-$GITHUB_RUN_ID"
            ALIAS="mpesatracker"
            KS_PASS="$KEY_PASS"
            keytool -genkeypair \
              -keystore android/app/signing/release.jks \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=M-PESA Tracker, OU=App, O=SaintM254, L=Nairobi, ST=Nairobi, C=KE" \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -storetype JKS
            echo "storeFile=signing/release.jks"  >  android/keystore.properties
            echo "storePassword=$KS_PASS"          >> android/keystore.properties
            echo "keyAlias=$ALIAS"                 >> android/keystore.properties
            echo "keyPassword=$KS_PASS"            >> android/keystore.properties
          fi
          ls -lh android/app/signing/release.jks

      - name: Install Capacitor deps
        run: npm ci

      - name: Sync web build into Android
        id: sync
        run: |
          set -e
          echo "=== Node & npm versions ==="
          node -v
          npm -v
          echo "=== Running cap sync ==="
          npx cap sync android 2>&1 | tee /tmp/cap-sync.log

      - name: Build signed release APK
        id: gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=summary 2>&1 | tee /tmp/gradle.log

      - name: Locate APK
        id: locate
        working-directory: android
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Verify APK signature
        working-directory: android
        run: |
          APK="${{ steps.locate.outputs.apk_path }}"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose --print-certs "$APK"

      - name: Stage release artefacts
        run: |
          mkdir -p release
          cp "android/${{ steps.locate.outputs.apk_path }}" release/app-release.apk
          (cd release && sha256sum app-release.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release/
          if-no-files-found: error

      - name: Post failure log to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ❌ Build failed — run #${{ github.run_number }}"
            echo
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f /tmp/cap-sync.log ]; then
              echo '<details><summary>cap sync log</summary>'
              echo
              echo '```'
              tail -c 60000 /tmp/cap-sync.log 2>/dev/null || echo '(no log)'
              echo '```'
              echo
              echo '</details>'
              echo
            fi
            if [ -f /tmp/gradle.log ]; then
              echo '<details><summary>gradle log (tail)</summary>'
              echo
              echo '```'
              tail -c 60000 /tmp/gradle.log 2>/dev/null || echo '(no log)'
              echo '```'
              echo
              echo '</details>'
            fi
          } > /tmp/body.md

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues \
            -f title="ci: build failure #${{ github.run_number }} on ${{ github.sha }}" \
            -f body="$(cat /tmp/body.md)" 2>&1 | tee /tmp/gh-post.log || true

  release:
    name: Publish GitHub Release
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.upload_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist

      - name: Determine release tag / name
        id: meta
        env:
          INPUT_TAG:  ${{ inputs.release_tag }}
          INPUT_NAME: ${{ inputs.release_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
            TAG="v1.1.0+${SHA}-$(date -u +%Y%m%d-%H%M)"
          fi
          if [ -n "$INPUT_NAME" ]; then NAME="$INPUT_NAME"; else NAME="M-PESA Tracker $TAG"; fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            ## M-PESA Tracker v1.1.0 — Android APK

            ### 🚀 New Release: Dedicated In-App Dashboard
            This update turns the APK into the **exact interactive application displayed on the mockup**:
            - **Header & Greeting**: Good morning, Brian Otieno with interactive profile customization.
            - **Balance Card**: Total spent (KSh 14,820), percentage trend vs previous month, and weekly activity bar graph.
            - **Interactive Dock Navigation**:
              - 📊 **Dashboard**: Recent transactions (Java House Westlands, Matatu, Airtime, Salary, KPLC tokens).
              - 📈 **Analytics**: Category spend breakdown with live progress bars (Food, Transport, Utilities, Airtime, Shopping, Rent).
              - ➕ **SMS Parser & Simulator**: Paste any Safaricom M-PESA SMS text or test with sample confirmations to parse reference code, amount, counterparty, and auto-categorize in real-time.
              - 🏷️ **Categories**: Color-coded category breakdown cards with count and expense sums.
              - ⚙️ **Settings**: Material You Light / Dark theme switch, custom user profile, CSV ledger export, and demo reset.
            - **100% Offline**: Zero internet permissions declared in `AndroidManifest.xml`. Data is securely stored in local storage on device.

            ### Installation:
            1. Download `app-release.apk` below.
            2. Tap **Install** (allow *Install unknown apps* for your browser if prompted).
            3. Enjoy full offline M-PESA expenditure tracking.

            SHA-256 checksums are in `SHA256SUMS.txt`.
          draft: false
          prerelease: false
          files: |
            dist/app-release.apk
            dist/SHA256SUMS.txt
