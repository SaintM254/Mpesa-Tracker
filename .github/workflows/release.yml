name: Build & release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"
      release_name:
        description: "Release display name"
        required: true
        default: "M-PESA Tracker v2.0.0"
  push:
    branches: [main, 'arena/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    name: Assemble signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS:   ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASS:        ${{ secrets.KEY_PASS }}
        run: |
          set -e
          mkdir -p android/app/signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using signing keystore from KEYSTORE_BASE64 secret."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/signing/release.jks
            echo "storeFile=signing/release.jks"          >  android/keystore.properties
            echo "storePassword=$KEYSTORE_PASS"           >> android/keystore.properties
            echo "keyAlias=$KEY_ALIAS"                    >> android/keystore.properties
            echo "keyPassword=$KEY_PASS"                  >> android/keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret — generating an ephemeral keystore for this build."
            KEY_PASS="mpesa-ephemeral-$GITHUB_RUN_ID"
            ALIAS="mpesatracker"
            KS_PASS="$KEY_PASS"
            keytool -genkeypair \
              -keystore android/app/signing/release.jks \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=M-PESA Tracker, OU=App, O=SaintM254, L=Nairobi, ST=Nairobi, C=KE" \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -storetype JKS
            echo "storeFile=signing/release.jks"  >  android/keystore.properties
            echo "storePassword=$KS_PASS"          >> android/keystore.properties
            echo "keyAlias=$ALIAS"                 >> android/keystore.properties
            echo "keyPassword=$KS_PASS"            >> android/keystore.properties
          fi
          ls -lh android/app/signing/release.jks

      - name: Install Capacitor deps
        run: npm ci

      - name: Sync web build into Android
        id: sync
        run: |
          set -e
          echo "=== Node & npm versions ==="
          node -v
          npm -v
          echo "=== Running cap sync ==="
          npx cap sync android 2>&1 | tee /tmp/cap-sync.log

      - name: Build signed release APK
        id: gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=summary 2>&1 | tee /tmp/gradle.log

      - name: Locate APK
        id: locate
        working-directory: android
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Verify APK signature
        working-directory: android
        run: |
          APK="${{ steps.locate.outputs.apk_path }}"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose --print-certs "$APK"

      - name: Stage release artefacts
        run: |
          mkdir -p release
          cp "android/${{ steps.locate.outputs.apk_path }}" release/app-release.apk
          (cd release && sha256sum app-release.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release/
          if-no-files-found: error

      - name: Post failure log to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ❌ Build failed — run #${{ github.run_number }}"
            echo
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f /tmp/cap-sync.log ]; then
              echo '<details><summary>cap sync log</summary>'
              echo
              echo '```'
              tail -c 60000 /tmp/cap-sync.log 2>/dev/null || echo '(no log)'
              echo '```'
              echo
              echo '</details>'
              echo
            fi
            if [ -f /tmp/gradle.log ]; then
              echo '<details><summary>gradle log (tail)</summary>'
              echo
              echo '```'
              tail -c 60000 /tmp/gradle.log 2>/dev/null || echo '(no log)'
              echo '```'
              echo
              echo '</details>'
            fi
          } > /tmp/body.md

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues \
            -f title="ci: build failure #${{ github.run_number }} on ${{ github.sha }}" \
            -f body="$(cat /tmp/body.md)" 2>&1 | tee /tmp/gh-post.log || true

  release:
    name: Publish GitHub Release
    needs: build
    # A successful build ALWAYS publishes a release — never skip.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist

      - name: Determine release tag / name
        id: meta
        env:
          INPUT_TAG:  ${{ inputs.release_tag }}
          INPUT_NAME: ${{ inputs.release_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # Push-triggered builds derive the tag from the single source of
            # truth: versionName in android/app/build.gradle (e.g. 2.0.0 -> v2.0.0)
            VER="$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')"
            TAG="v${VER:-2.0.0}"
          fi
          if [ -n "$INPUT_NAME" ]; then NAME="$INPUT_NAME"; else NAME="M-PESA Tracker $TAG"; fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            ## M-PESA Tracker v2.0.0 — Android APK

            ### 🚀 What's new in v2.0.0
            - **Clean zero-mock start**: All demo/dummy transactions removed — the app opens on a pristine, empty ledger. A first-run SMS permission popup asks once, then immediately imports your real M-PESA history.
            - **Crisp inline SVG icons everywhere**: The Material Icons webfont is gone (it broke icons and bled raw text when offline). Every icon — navigation dock, transaction/category tiles, sun ☀️ / moon 🌙 theme toggle, settings — is now a razor-sharp inline vector that renders identically online and offline.
            - **Sync SMS Inbox in Settings**: One-tap tool that re-scans your SMS inbox for M-PESA messages and imports anything new (deduplicated by transaction code). The app also silently syncs on startup once permission is granted.
            - **Branded M-PESA launcher icon**: Green M-PESA tile with the white “M” mark and coin accent across every density and adaptive icon path.
            - **Real analytics**: Balance-card weekly chart, month trend chip, and breakdowns are computed from your actual data — no static placeholders.
            - **100% Offline**: No internet permission, no fonts or assets fetched from the network. Your financial SMS data never leaves the device.

            ### Installation:
            1. Download `app-release.apk` below.
            2. Tap **Install** (allow *Install unknown apps* for your browser if prompted).
            3. Grant SMS access on first launch and your M-PESA transactions appear automatically.

            SHA-256 checksums are in `SHA256SUMS.txt`.
          draft: false
          prerelease: false
          files: |
            dist/app-release.apk
            dist/SHA256SUMS.txt
