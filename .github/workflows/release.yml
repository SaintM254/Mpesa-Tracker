name: Build & release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.1.1)"
        required: true
        default: "v2.1.1"
      release_name:
        description: "Release display name"
        required: true
        default: "M-PESA Tracker v2.1.1"
  push:
    branches: [main, 'arena/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    name: Assemble signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS:   ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASS:        ${{ secrets.KEY_PASS }}
        run: |
          set -e
          mkdir -p android/app/signing
          if [ -f android/app/signing/release.p12 ] && [ -f android/keystore.properties ]; then
            echo "Using the PINNED release key committed in the repo (reproducible signatures — updates install on top of previous versions)."
            ls -lh android/app/signing/release.p12
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using signing keystore from KEYSTORE_BASE64 secret."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/signing/release.jks
            echo "storeFile=signing/release.jks"          >  android/keystore.properties
            echo "storePassword=$KEYSTORE_PASS"           >> android/keystore.properties
            echo "keyAlias=$KEY_ALIAS"                    >> android/keystore.properties
            echo "keyPassword=$KEY_PASS"                  >> android/keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret — generating an ephemeral keystore for this build."
            KEY_PASS="mpesa-ephemeral-$GITHUB_RUN_ID"
            ALIAS="mpesatracker"
            KS_PASS="$KEY_PASS"
            keytool -genkeypair \
              -keystore android/app/signing/release.jks \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=M-PESA Tracker, OU=App, O=SaintM254, L=Nairobi, ST=Nairobi, C=KE" \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -storetype JKS
            echo "storeFile=signing/release.jks"  >  android/keystore.properties
            echo "storePassword=$KS_PASS"          >> android/keystore.properties
            echo "keyAlias=$ALIAS"                 >> android/keystore.properties
            echo "keyPassword=$KS_PASS"            >> android/keystore.properties
          fi
          ls -lh android/app/signing/ 2>/dev/null || true

      - name: Install Capacitor deps
        run: npm ci

      - name: Sync web build into Android
        id: sync
        run: |
          set -e
          echo "=== Node & npm versions ==="
          node -v
          npm -v
          echo "=== Running cap sync ==="
          npx cap sync android 2>&1 | tee /tmp/cap-sync.log

      - name: Build signed release APK
        id: gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=summary 2>&1 | tee /tmp/gradle.log

      - name: Locate APK
        id: locate
        working-directory: android
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Verify APK signature
        working-directory: android
        run: |
          APK="${{ steps.locate.outputs.apk_path }}"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose --print-certs "$APK"

      - name: Stage release artefacts
        run: |
          mkdir -p release
          cp "android/${{ steps.locate.outputs.apk_path }}" release/app-release.apk
          (cd release && sha256sum app-release.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release/
          if-no-files-found: error

      - name: Post failure log to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ❌ Build failed — run #${{ github.run_number }}"
            echo
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f /tmp/cap-sync.log ]; then
              echo '<details><summary>cap sync log</summary>'
              echo
              echo '```'
              tail -c 60000 /tmp/cap-sync.log 2>/dev/null || echo '(no log)'
              echo '```'
              echo
              echo '</details>'
              echo
            fi
            if [ -f /tmp/gradle.log ]; then
              echo '<details><summary>gradle log (tail)</summary>'
              echo
              echo '```'
              tail -c 60000 /tmp/gradle.log 2>/dev/null || echo '(no log)'
              echo '```'
              echo
              echo '</details>'
            fi
          } > /tmp/body.md

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/issues \
            -f title="ci: build failure #${{ github.run_number }} on ${{ github.sha }}" \
            -f body="$(cat /tmp/body.md)" 2>&1 | tee /tmp/gh-post.log || true

  release:
    name: Publish GitHub Release
    needs: build
    # A successful build ALWAYS publishes a release — never skip.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Checkout is required: the tag is derived from versionName in
      # android/app/build.gradle, which lives in the repository tree.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artefacts
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist

      - name: Determine release tag / name
        id: meta
        env:
          INPUT_TAG:  ${{ inputs.release_tag }}
          INPUT_NAME: ${{ inputs.release_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # Push-triggered builds derive the tag from the single source of
            # truth: versionName in android/app/build.gradle (e.g. 2.0.0 -> v2.0.0)
            VER="$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')"
            TAG="v${VER:-2.0.0}"
          fi
          if [ -n "$INPUT_NAME" ]; then NAME="$INPUT_NAME"; else NAME="M-PESA Tracker $TAG"; fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          # Always tag the exact commit that produced this APK — without this,
          # the tag silently lands on the default branch's HEAD instead.
          target_commitish: ${{ github.sha }}
          body: |
            ## M-PESA Tracker v2.1.1 — Android APK

            ### 🚀 What's new in v2.1.1
            - **App icon fixed & everywhere**: the coin artwork is re-scaled so nothing clips inside adaptive icon masks (verified against the 66% safe zone). Launcher, splash, favicon, the About row in Settings and the repo README all show the new icon — the old “M” is gone for good.
            - **Update-friendly signing from now on**: the release key is now pinned (committed PKCS#12 keystore), so every future APK is signed identically and installs straight on top of the previous one. ⚠️ One-time: v2.1.0 and older were signed with throwaway per-run keys that no longer exist, so they must be uninstalled once — Android blocks their update path by design. After this release, updates are seamless forever.
            - **Weekly chart with day labels**: weekday names under every bar; tap a bar to read that day's total spend. Defaults to today and survives re-renders.
            - **New “Transactions” tab** (replaces the ➕ Parse tab with a receipt icon): *View all* on the dashboard routes here and auto-highlights the tab. Transactions are grouped into **collapsible Year/Month accordions** (“September 2026”) with monthly spend totals; the latest month is expanded by default. Tapping any row opens the same Change-Category popup used on Home — edits re-render everywhere instantly, and scroll position & expanded state are preserved while switching tabs. The manual paste-SMS tool lives at the bottom of this tab.

            ### Installation:
            1. ⚠️ Uninstall v2.1.0 or older **once** (their signing keys were per-run and differ from this build — Android requirement).
            2. Download `app-release.apk` below and install.
            3. All future versions update in place — no more “conflicting signatures”.

            SHA-256 checksums are in `SHA256SUMS.txt`.
          draft: false
          prerelease: false
          files: |
            dist/app-release.apk
            dist/SHA256SUMS.txt
